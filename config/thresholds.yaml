# 룰 임계값 설정
# 값은 잠정치이며 6단계 튜닝 실험에서 확정한다.

ctr:
  threshold_usd: 10000        # CTR 기준액 대응 (한국 1000만원 / 미국 $10,000)
  window_days: 1              # 1거래일

r01_structuring:
  window_days: 1              # 집계 창 (거래일)
  min_count: 2                # 최소 거래 건수
  near_ratio: 0.5             # 기준액 근접도 — 5천~1만 달러 구간

r02_passthrough:
  window_hours: 120           # 72 → 120 (재현율 +3.2%p, 정밀도 유지)
  pass_ratio: 0.5             # 0.7 → 0.5 (효과 없어 느슨하게)
  min_in: 3
  min_in_parties: 3           # 핵심 지렛대 — 유지
  min_out_parties: 2
  min_amount: 1000
  candidate_min_txns: 6

r03_circular:
  min_amount: 5000
  min_len: 3
  max_len: 10                 # 8 → 10 (재현율·정밀도 동시 개선)
  amount_tolerance: 0.5
  max_duration_days: 30
  max_cycles: 50000

r04_cross_border:
  amount_threshold_usd: 10000   # 유지 — 법정 기준(CTR $10,000) 근거
  window_days: 7                # 유지
  min_txns: 1