# 룰 임계값 설정
# 값은 잠정치이며 6단계 튜닝 실험에서 확정한다.

ctr:
  threshold_usd: 10000        # CTR 기준액 대응 (한국 1000만원 / 미국 $10,000)
  window_days: 1              # 1거래일

r01_structuring:
  window_days: 1              # 집계 창 (거래일)
  min_count: 2                # 최소 거래 건수
  near_ratio: 0.5             # 기준액 근접도 — 5천~1만 달러 구간

r02_passthrough:
  window_hours: 120           # 72 → 120 (재현율 +3.2%p, 정밀도 유지)
  pass_ratio: 0.5             # 0.7 → 0.5 (효과 없어 느슨하게)
  min_in: 3
  min_in_parties: 3           # 핵심 지렛대 — 유지
  min_out_parties: 2
  min_amount: 1000
  candidate_min_txns: 6

r03_circular:
  min_amount: 5000            # 후보 간선 최소 금액
  min_len: 3                  # 최소 순환 길이 (hop)
  max_len: 8                  # 최대 순환 길이
  amount_tolerance: 0.5       # 경로상 금액 편차 허용 (50%)
  max_duration_days: 30       # 순환 완료 소요 기간 상한
  max_cycles: 50000           # 탐색 상한 (안전장치)

r04_cross_border:
  amount_threshold_usd: 10000
  window_days: 7
  min_txns: 1